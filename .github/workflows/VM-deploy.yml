name: VM Deploy OpenCode

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vm-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_ADMIN }}
          password: ${{ secrets.ADMIN_PASSWORD }}
          script: |
            set -e
            cd /home/quality-street/code/${{ secrets.REPO_NAME }}
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            docker compose up -d --build
            docker compose ps
