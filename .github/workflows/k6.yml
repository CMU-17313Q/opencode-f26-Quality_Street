name: k6

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  K6_VERSION: v2.3.0
  BASE_URL: http://127.0.0.1:4096

jobs:
  performance:
    name: k6 performance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Start OpenCode server
        run: |
          bun run --cwd packages/opencode --conditions=browser src/index.ts serve --hostname 127.0.0.1 --port 4096 \
            > opencode-server.log 2>&1 &

      - name: Wait for the server to be ready
        run: |
          for attempt in $(seq 1 60); do
            if curl -sf "$BASE_URL/global/health" > /dev/null; then
              echo "Server ready after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become ready in 60s"
          cat opencode-server.log
          exit 1

      - name: Install k6
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz"
          curl -sSfLO "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-checksums.txt"
          sha256sum --check --ignore-missing "k6-${K6_VERSION}-checksums.txt"
          tar -xzf "k6-${K6_VERSION}-linux-amd64.tar.gz"
          echo "$RUNNER_TEMP/k6-${K6_VERSION}-linux-amd64" >> "$GITHUB_PATH"

      - name: Run k6 smoke test
        env:
          K6_WEB_DASHBOARD: "true"
          K6_WEB_DASHBOARD_EXPORT: k6-report.html
        run: k6 run --summary-export=k6-summary.json tests/performance/smoke.js 2>&1 | tee k6-output.txt

      - name: Upload k6 report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: k6-report
          path: |
            k6-summary.json
            k6-report.html
            k6-output.txt
            opencode-server.log
          if-no-files-found: warn
