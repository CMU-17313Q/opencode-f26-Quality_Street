name: Retire.js Security Scan
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - name: Build web app
        working-directory: packages/app
        run: bun run build
      - name: Run Retire.js
        working-directory: packages/app
        shell: bash
        run: bun run security:retire 2>&1 | tee retire-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retire-report
          path: packages/app/retire-report.txt
